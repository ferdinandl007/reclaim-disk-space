<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
  <title id="title">Reclaim Disk Space: a disk radar for agents</title>
  <desc id="desc">A dark macOS storage map showing a read-only scan flowing into APFS accounting, file classification, and guarded cleanup.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1c2a32" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>
  <rect width="1280" height="520" rx="24" fill="#0b1116"/>
  <rect width="1280" height="520" rx="24" fill="url(#grid)" opacity=".72"/>
  <circle cx="1020" cy="268" r="150" fill="#21d4c2" opacity=".08" filter="url(#soft)"/>
  <circle cx="1020" cy="268" r="120" fill="none" stroke="#35515a" stroke-width="1"/>
  <circle cx="1020" cy="268" r="80" fill="none" stroke="#35515a" stroke-width="1"/>
  <circle cx="1020" cy="268" r="42" fill="none" stroke="#35515a" stroke-width="1"/>
  <path d="M870 268h300M1020 118v300M914 162l212 212M1126 162L914 374" stroke="#22363e" stroke-width="1"/>
  <path d="M1020 268L1116 192" stroke="#f37b46" stroke-width="3" stroke-linecap="round"/>
  <circle cx="1116" cy="192" r="6" fill="#f37b46"/>
  <circle cx="1020" cy="268" r="8" fill="#21d4c2"/>

  <g font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <text x="66" y="76" fill="#21d4c2" font-size="14" letter-spacing="3">MACOS STORAGE INTELLIGENCE / AGENT EDITION</text>
    <text x="64" y="150" fill="#f5f7f4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="58" font-weight="700" letter-spacing="-2">Give your agent</text>
    <text x="64" y="216" fill="#f37b46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="58" font-weight="700" letter-spacing="-2">a disk radar.</text>
    <text x="68" y="264" fill="#a9bdc2" font-size="17">APFS truth · tiny-file pressure · stack-aware cleanup</text>

    <rect x="66" y="322" width="438" height="112" rx="12" fill="#111c22" stroke="#29414a"/>
    <text x="88" y="353" fill="#21d4c2" font-size="13">SCAN CONTRACT</text>
    <text x="88" y="380" fill="#eaf1ef" font-size="16">read-only first</text>
    <text x="88" y="407" fill="#eaf1ef" font-size="16">exact path · explicit confirmation</text>
    <circle cx="453" cy="378" r="9" fill="#21d4c2"/>
    <path d="M448 378l4 4 8-10" fill="none" stroke="#0b1116" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="864" y="88" fill="#a9bdc2" font-size="12" letter-spacing="2">LIVE STORAGE MAP</text>
    <text x="864" y="112" fill="#f5f7f4" font-size="19">workers=auto</text>
    <text x="864" y="454" fill="#a9bdc2" font-size="13">private / allocated / logical</text>
    <text x="864" y="477" fill="#a9bdc2" font-size="13">classified without deleting the unknown</text>

    <path d="M534 378h154" stroke="#f37b46" stroke-width="2" stroke-dasharray="5 7"/>
    <path d="M688 378l-12-7v14z" fill="#f37b46"/>
    <g transform="translate(560 338)">
      <rect width="96" height="72" rx="8" fill="#17252b" stroke="#31505a"/>
      <text x="16" y="28" fill="#a9bdc2" font-size="11">agent</text>
      <text x="16" y="51" fill="#f5f7f4" font-size="16">→ report</text>
    </g>
  </g>
</svg>
